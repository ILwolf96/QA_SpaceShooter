name: QA Space Shooter CI/CD

on:
  push:
    branches:
      - main
      - master
      - develop
      - CI/CD

  pull_request:
    branches:
      - main
      - master
      - develop

  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  UNITY_VERSION: '6000.0.43f1'

jobs:

  # ============================================================
  # UNITY AUTOMATED TESTS
  # ============================================================

  test:
    name: Unity Automated Tests
    runs-on: ubuntu-latest

    steps:

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Linux-${{ env.UNITY_VERSION }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Linux-${{ env.UNITY_VERSION }}-
            Library-Linux-

      - name: Run Unity Automated Tests
        id: unity-tests
        continue-on-error: true
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: all
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity Automated Tests

      - name: Upload Unity Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Unity-Test-Results
          path: ${{ steps.unity-tests.outputs.artifactsPath }}

      - name: Report Test Result
        if: always()
        run: |
          echo "Unity automated test execution completed."
          echo "Known baseline failures are retained as QA findings."
          echo "Test results are available in the workflow artifacts."


  # ============================================================
  # WEBGL BUILD
  # ============================================================

  webgl-build:
    name: WebGL Build
    runs-on: ubuntu-latest
    needs: test

    steps:

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ env.UNITY_VERSION }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-${{ env.UNITY_VERSION }}-
            Library-WebGL-

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: WebGL

      - name: Upload WebGL Build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WebGL-Build
          path: build
